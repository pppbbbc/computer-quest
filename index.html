<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="A hands-on computer science quest for curious kids.">
  <title>Computer Quest</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23152240'/%3E%3Cpath d='M16 23h32v19H16zM24 49h16' fill='none' stroke='%235be5c0' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf3ff;background:#0c1527;font-size:16px}
    *{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ffe38b;outline-offset:3px}
    .app{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}
    .brand{display:flex;align-items:center;gap:12px;font-size:1.25rem;font-weight:850;letter-spacing:-.04em}.mark{display:grid;place-items:center;width:43px;height:43px;border-radius:13px;background:#59e4bf;color:#10223b;font-weight:900;font-size:1.5rem}
    .progress{min-width:190px;color:#a9bdd5;font-size:.9rem;text-align:right}.bar{height:8px;background:#26344e;border-radius:20px;margin-top:8px;overflow:hidden}.fill{height:100%;background:#59e4bf;transition:width .3s}
    .layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:24px}.sidebar,.panel{background:#15223b;border:1px solid #293c5b;border-radius:22px}
    .sidebar{padding:20px;align-self:start}.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:#64dbbe;font-weight:800}.sidebar h2{font-size:1.35rem;margin:7px 0 4px}.muted{color:#a9bdd5;line-height:1.55}.sidebar p{font-size:.9rem;margin:0 0 18px}
    .mission-list{display:grid;gap:8px}.mission{width:100%;background:transparent;color:#c7d8ec;border:1px solid transparent;border-radius:12px;text-align:left;padding:12px;display:flex;align-items:center;gap:11px}.mission:hover{background:#223552}.mission.active{background:#254260;color:white;border-color:#447997}.mission .number{flex:none;width:28px;height:28px;border-radius:9px;background:#30415b;display:grid;place-items:center;font-size:.78rem;font-weight:800}.mission.done .number{background:#4fd6b1;color:#12233b}.mission span:last-child{font-weight:650;font-size:.88rem}
    .panel{padding:36px 44px;min-height:650px}.unit{color:#7ed9c2;font-size:.84rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em}h1{font-size:clamp(2rem,4vw,3.1rem);letter-spacing:-.055em;line-height:1.08;margin:14px 0 14px}.intro{font-size:1.13rem;line-height:1.55;color:#c6d9ec;max-width:650px}.lesson{border-top:1px solid #31415d;margin-top:28px;padding-top:28px}.lesson h2{font-size:1.25rem;margin:0 0 10px}.lesson p{line-height:1.7;color:#d8e5f3;margin:0 0 15px}.example{border-left:4px solid #59e4bf;background:#1b3048;border-radius:0 12px 12px 0;padding:15px 18px;color:#e7f7f3;line-height:1.6}.example strong{color:#62e7c2}
    .challenge{margin-top:30px;background:#1b2c47;border:1px solid #3a5579;border-radius:18px;padding:23px}.challenge h2{margin:0 0 6px;font-size:1.25rem}.challenge p{color:#cad9eb;line-height:1.5}.choices{display:grid;gap:10px;margin-top:16px}.choice{background:#223755;border:1px solid #3b587b;border-radius:12px;color:#f1f6ff;text-align:left;padding:14px 17px;line-height:1.4}.choice:hover{border-color:#72d9c3;background:#2b4867}.choice.selected{border-color:#69e5c5;background:#284d59}.choice.wrong{border-color:#ff9b9b}.feedback{padding:14px 16px;border-radius:12px;margin-top:16px;line-height:1.5}.feedback.good{background:#184a44;color:#c2ffe9}.feedback.try{background:#513a3d;color:#ffe4dd}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:24px}.primary,.secondary{border-radius:12px;padding:12px 18px;font-weight:800}.primary{background:#59e4bf;color:#10253c;border:0}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{background:transparent;color:#b9cce2;border:1px solid #405674}.hint{font-size:.86rem;color:#9eb4cf}.complete{display:inline-flex;align-items:center;gap:8px;border-radius:100px;padding:8px 13px;background:#1b514a;color:#baffe6;font-weight:700;font-size:.85rem}
    @media(max-width:800px){.app{padding:16px}.layout{grid-template-columns:1fr}.sidebar{padding:15px}.mission-list{display:flex;overflow-x:auto;padding-bottom:4px}.mission{min-width:175px}.sidebar p{display:none}.panel{padding:25px 20px;min-height:0}.top{align-items:flex-start}.progress{min-width:130px}}
  </style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand"><div class="mark" aria-hidden="true">C</div>Computer Quest</div><div class="progress"><span id="progressText">0 of 10 missions complete</span><div class="bar" role="progressbar" aria-label="Course progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="progressBar"><div class="fill" id="progressFill"></div></div></div></header>
  <div class="layout"><aside class="sidebar"><div class="eyebrow">Your learning path</div><h2>Explore the machine</h2><p class="muted">Read, make a prediction, then solve one challenge. A short lesson and one challenge in each mission.</p><nav class="mission-list" id="missionList" aria-label="Missions"></nav></aside><main class="panel" id="content" tabindex="-1"></main></div>
</div>
<script>
const missions=[
 {category:"The machine",title:"What is a computer?",intro:"A computer follows instructions to turn input into output.",body:"Input is information coming in: a key press, a tap, or a camera image. A processor follows instructions. Output is what the computer sends back, like a picture or sound. A computer can also store information for later.",example:"In a game: pressing Space is input → the program decides what to do → your character jumps on screen.",question:"You click a button and hear a sound. What is the sound?",options:["Input","Output","Storage"],answer:1,why:"The sound comes out of the computer, so it is output."},
 {category:"The machine",title:"Meet the hardware",intro:"Different computer parts have different jobs.",body:"The CPU carries out instructions. RAM holds information the computer is using right now. Storage keeps files even after power is off. A screen shows output. Computers work because these parts cooperate.",example:"Think of a desk: CPU = the worker, RAM = the space on the desk, storage = the cupboard.",question:"Your drawing is saved and you turn off the computer. Where should it remain?",options:["RAM","Storage","CPU"],answer:1,why:"Storage keeps saved files when the computer is off. RAM is temporary."},
 {category:"The machine",title:"Software gives instructions",intro:"Hardware is the physical equipment; software tells it what to do.",body:"An operating system manages the computer and helps apps use its hardware. An app is software for a task, such as drawing or playing a game. A game you make in Roblox Studio is software too.",example:"A keyboard is hardware. The program deciding what happens when you press W is software.",question:"Which one is software?",options:["A mouse","A graphics card","A drawing app"],answer:2,why:"An app is a program. A mouse and graphics card are physical hardware."},
 {category:"Information",title:"Everything becomes data",intro:"Computers represent information using patterns of bits.",body:"A bit can be 0 or 1. Groups of bits can represent numbers, letters, colours, sounds, and images. The meaning depends on the rules used to interpret those bits.",example:"The number 5 can be written as 101 in binary: one 4, zero 2s, and one 1.",question:"What does the binary number 110 mean? (4 + 2 + 0)",options:["3","6","7"],answer:1,why:"110 is one 4, one 2, and zero 1s: 4 + 2 = 6."},
 {category:"Information",title:"Files and formats",intro:"A file stores data with a name; its format tells an app how to read it.",body:"A picture, a song, and a text document contain different kinds of data. The file extension, such as .png or .txt, is a useful clue about its format. Changing a file's name does not magically change the data inside.",example:"Renaming photo.png to photo.mp3 does not turn the picture into a song.",question:"You rename a .png image to .mp3. What happens?",options:["It becomes music","Its name changes, but its contents are still image data","All data is deleted"],answer:1,why:"A filename can change without converting the file's actual format."},
 {category:"Connected world",title:"How the internet moves data",intro:"The internet is a network of connected networks.",body:"Your device sends a request through a network to another computer called a server. The server sends data back. Data can travel in small pieces called packets, which are put together at the destination.",example:"Opening a webpage: your browser asks a server for the page, receives its data, and displays it.",question:"When you open a website, which device usually sends back its page data?",options:["The server","Your keyboard","Your screen"],answer:0,why:"Your browser requests the page, and a server responds with the data."},
 {category:"Connected world",title:"Websites and browsers",intro:"The web is one service that uses the internet.",body:"A browser such as Chrome reads webpage files and shows them on screen. A URL tells the browser where to ask for a resource. The internet also carries other services, so the web and the internet are related but not identical.",example:"A webpage is like one destination; the internet is the system of routes connecting devices.",question:"Which statement is most accurate?",options:["The internet is only websites","A browser is a type of keyboard","The web uses the internet"],answer:2,why:"The web runs over the internet, which supports many other services too."},
 {category:"Thinking like a creator",title:"Algorithms are steps",intro:"An algorithm is a clear set of steps for solving a problem.",body:"Instructions need to be precise enough that someone else can follow them. Order matters. Computers do exactly what their instructions say, including mistakes in those instructions.",example:"Game rule: if the player touches a coin, add 1 point, hide the coin, and play a sound.",question:"To give a player a point only when they touch a coin, which rule works?",options:["Always add a point","If touching a coin, add a point","Remove every coin before playing"],answer:1,why:"The condition checks whether the event happened before adding a point."},
 {category:"Thinking like a creator",title:"Test, debug, improve",intro:"A bug is a problem in how a program works; debugging means finding its cause.",body:"Start with one repeatable example. Predict what should happen. Test what actually happens. Change one thing, test again, and keep notes. A surprising result is a clue, not a failure.",example:"If a door never opens, check the trigger, the condition, and the action one at a time.",question:"Your game door will not open. What is the best first step?",options:["Change ten things at once","Recreate the problem and check one step at a time","Delete the entire game"],answer:1,why:"A repeatable test and one change at a time help identify the cause."},
 {category:"Connected world",title:"Protect your information",intro:"Being a creator also means making careful choices online.",body:"A strong password should be unique. Two-step verification adds another check. Be careful with links, downloads, and requests for personal information. Ask a trusted adult before sharing private details or installing unfamiliar game assets.",example:"A free game model may include code you did not write. Inspect it with an adult before using it.",question:"A stranger asks for your password to help fix your game. What should you do?",options:["Share it privately","Use a shorter password","Do not share it and tell a trusted adult"],answer:2,why:"Passwords are private. A legitimate helper does not need yours."}
];
const key="computer-quest-v1";
let state={done:[],current:0};try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&Array.isArray(saved.done)){state.done=saved.done.filter(x=>Number.isInteger(x)&&x>=0&&x<missions.length);state.current=Math.max(0,Math.min(missions.length-1,Number(saved.current)||0))}}catch(e){}
let selected=null,checked=false;
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}
function select(i){if(i<0||i>=missions.length)return;state.current=i;selected=null;checked=false;save();render();document.getElementById("content").focus()}
function render(){
 const n=state.done.length;
 document.getElementById("progressText").textContent=n+" of "+missions.length+" missions complete";
 document.getElementById("progressFill").style.width=(n/missions.length*100)+"%";
 document.getElementById("progressBar").setAttribute("aria-valuenow",n);
 document.getElementById("missionList").innerHTML=missions.map((m,i)=>'<button class="mission '+(i===state.current?'active ':'')+(state.done.includes(i)?'done':'')+'" type="button" data-mission="'+i+'" '+(i===state.current?'aria-current="step"':'')+'><span class="number">'+(state.done.includes(i)?'✓':String(i+1).padStart(2,"0"))+'</span><span>'+m.title+'</span></button>').join("");
 const m=missions[state.current],passed=state.done.includes(state.current);
 document.getElementById("content").innerHTML='<div class="unit">Mission '+String(state.current+1).padStart(2,"0")+' / '+missions.length+' · '+m.category+'</div><h1>'+m.title+'</h1><p class="intro">'+m.intro+'</p>'+(passed?'<span class="complete">✓ Mission complete</span>':'')+'<section class="lesson"><h2>Learn it</h2><p>'+m.body+'</p><div class="example"><strong>In real life</strong><br>'+m.example+'</div></section><section class="challenge"><div class="unit">Your challenge</div><h2>Make a prediction</h2><p>'+m.question+'</p><div class="choices">'+m.options.map((o,i)=>'<button class="choice '+(selected===i?'selected ':'')+(checked&&selected===i&&i!==m.answer?'wrong':'')+'" type="button" data-choice="'+i+'" aria-pressed="'+(selected===i)+'">'+o+'</button>').join('')+'</div>'+(checked?'<div class="feedback '+(selected===m.answer?'good':'try')+'" role="status">'+(selected===m.answer?'Correct! ':'Not quite. ')+m.why+'</div>':'')+'<div class="actions"><span class="hint">Choose an answer, then check it.</span><button type="button" class="primary" id="check" '+(selected===null?'disabled':'')+'>'+((checked&&selected!==m.answer)?'Try again':'Check answer')+'</button></div></section><div class="actions"><button type="button" class="secondary" id="prev" '+(state.current===0?'disabled':'')+'>Previous</button><button type="button" class="primary" id="next" '+(state.current===missions.length-1||!passed?'disabled':'')+'>Next mission</button></div>';
 document.querySelectorAll("[data-mission]").forEach(b=>b.onclick=()=>select(Number(b.dataset.mission)));
 document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{selected=Number(b.dataset.choice);checked=false;render()});
 document.getElementById("check").onclick=()=>{if(selected===null)return;checked=true;if(selected===m.answer&&!state.done.includes(state.current)){state.done.push(state.current);save()}render()};
 document.getElementById("prev").onclick=()=>select(state.current-1);
 document.getElementById("next").onclick=()=>{if(state.done.includes(state.current)&&state.current<missions.length-1)select(state.current+1)};
}
render();
if(document.modelContext?.registerTool){
  Promise.resolve(document.modelContext.registerTool({
    name:"open_computer_mission",title:"Open a Computer Quest mission",
    description:"Show a numbered mission in the visible learning interface.",
    inputSchema:{type:"object",properties:{mission:{type:"integer",minimum:1,maximum:10}},required:["mission"],additionalProperties:false},
    annotations:{readOnlyHint:false,untrustedContentHint:false},
    execute(input){if(!Number.isInteger(input?.mission)||input.mission<1||input.mission>missions.length)throw Error("Mission must be a number from 1 to 10");select(input.mission-1);return {mission:input.mission,title:missions[state.current].title}}
  })).catch(()=>{});
}
</script>
</body>
</html>
